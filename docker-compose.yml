services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DPR_POSTGRES_DB:-distressed_property_radar}
      POSTGRES_TEST_DB: ${DPR_POSTGRES_TEST_DB:-distressed_property_radar_test}
      POSTGRES_USER: ${DPR_POSTGRES_USER:-distressed_property_radar}
      POSTGRES_PASSWORD: ${DPR_POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${DPR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
